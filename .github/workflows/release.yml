name: Release

# CI build + publish. Does NOT run by default: only builds when the head commit of the push
# contains the marker '[release]'. Also runnable manually (workflow_dispatch).
# Notes-only mode: marker '[release_notes_only]' (or dispatch with input release_notes_only)
# only regenerates GitHub Release notes (no build/pack/upload/nuget); HEAD is not a build point.
#
# /releases model: each minor line M.N has one GitHub Release named by the tag 'vM.N.0'.
# Each run -> pack every lib with a .nuspec as version 'M.N.<commits>' -> upload all nupkg as
# assets to Release 'vM.N.0' + update the notes (ascending, numbered) for changes since 'vM.N.0'.
#
# Precondition: tag 'vM.N.0' must already exist on origin (GitVersion source + Release name).
# Push to nuget.org only when the 'nugetKey' secret is present.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_notes_only:
        description: 'Only regenerate GitHub Release notes (skip build/pack/upload/nuget)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[release_notes_only]')
    runs-on: windows-latest
    env:
      # 'true' for notes-only: dispatch chose release_notes_only, or head commit contains '[release_notes_only]'
      NOTES_ONLY: ${{ inputs.release_notes_only || contains(github.event.head_commit.message, '[release_notes_only]') }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Highest TFM is net8.0, and a newer SDK builds older TFMs via reference packs. So major >= 8
      # is enough; only run setup-dotnet when none is present (windows-latest usually ships >= 8).
      - name: Check installed .NET SDKs
        if: env.NOTES_ONLY != 'true'
        id: dotnet_check
        shell: pwsh
        run: |
          $sdks = if (Get-Command dotnet -ErrorAction SilentlyContinue) { @(dotnet --list-sdks 2>$null) } else { @() }
          $haveSdk = [bool]($sdks | Where-Object { if ($_ -match '^(\d+)\.') { [int]$Matches[1] -ge 8 } })
          $install = -not $haveSdk
          Add-Content -Path $env:GITHUB_OUTPUT -Value "install=$($install.ToString().ToLower())"
          Write-Host "Installed SDKs:`n$($sdks -join "`n")"
          Write-Host "Have .NET SDK >= 8: $haveSdk  -> install=$install"

      - name: Setup .NET
        if: ${{ env.NOTES_ONLY != 'true' && steps.dotnet_check.outputs.install == 'true' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install git-cliff
        shell: pwsh
        run: |
          $ver = "2.13.1"
          $url = "https://github.com/orhun/git-cliff/releases/download/v$ver/git-cliff-$ver-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP "git-cliff.zip"
          Invoke-WebRequest $url -OutFile $zip
          $dst = Join-Path $env:RUNNER_TEMP "git-cliff"
          Expand-Archive $zip -DestinationPath $dst -Force
          $exe = Get-ChildItem $dst -Recurse -Filter git-cliff.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

      - name: "Build + pack (publishable TqkLibrary.Proxy libraries)"
        if: env.NOTES_ONLY != 'true'
        shell: pwsh
        run: ./.github/workflows/BuildCI.ps1   # pack only; nuget push handled below

      - name: Create/update Release, upload nupkg, push nuget
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_KEY: ${{ secrets.nugetKey }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notesOnly = $env:NOTES_ONLY -eq 'true'
          if ($notesOnly) {
            # Notes-only: no nupkg -> derive M.N from the branch name (if it is a version-branch M.N);
            # otherwise (e.g. master) take the nearest tag in history.
            $bn = $env:GITHUB_REF_NAME
            if ($bn -match '^(\d+)\.(\d+)$') { $major = $Matches[1]; $minor = $Matches[2] }
            else {
              $near = "$(git describe --tags --abbrev=0 --match "v[0-9]*")".Trim()
              if ($near -notmatch '^v(\d+)\.(\d+)\.') { throw "Cannot derive minor line from branch '$bn' / tag '$near'" }
              $major = $Matches[1]; $minor = $Matches[2]
            }
            $nupkgs = @()
          } else {
            $nupkgs = @(Get-ChildItem ./artifacts/*.nupkg)
            if ($nupkgs.Count -eq 0) { throw "No .nupkg produced by BuildCI.ps1" }
            # M.N comes from the core 'TqkLibrary.Proxy' package (name = TqkLibrary.Proxy.<M>.<N>.<build>.nupkg).
            $core = $nupkgs | Where-Object { $_.Name -match '^TqkLibrary\.Proxy\.(\d+)\.(\d+)\.(\d+)\.nupkg$' } | Select-Object -First 1
            if (-not $core) { throw "Cannot find core TqkLibrary.Proxy nupkg to parse version" }
            $null = $core.Name -match '^TqkLibrary\.Proxy\.(\d+)\.(\d+)\.(\d+)\.nupkg$'
            $major = $Matches[1]; $minor = $Matches[2]
          }
          $tag = "v$major.$minor.0"   # tags carry the 'v' prefix (v1.0.0)
          $mn  = "$major.$minor"
          if ($notesOnly) { Write-Host "notes-only  release-tag=$tag" }
          else { Write-Host "$($nupkgs.Count) nupkg  release-tag=$tag" }

          # Release notes: each BUILD is one header '- M.N.<zzz>' with zzz = rev-list --count tag..R
          # (matches the nupkg version since GitVersion counts ALL commits). Build point R = commits
          # (first-parent) carrying the '[release]' marker + current HEAD (this run's build, not
          # duplicated if HEAD itself is [release]). Sub-item '  + ...' = every new commit reachable in
          # (R_prev..R], naturally including commits merged in from other branches.
          # git-cliff only formats each commit, prefixing every line with '__SHA_<sha>__' for lookup.
          $lineOf = @{}
          foreach ($l in @(git-cliff --config cliff-release.toml "$tag..HEAD")) {
            if ($l -match '^__SHA_([0-9a-f]+)__ (.*)$') { $lineOf[$Matches[1]] = $Matches[2] }
          }
          $fps = @(git rev-list --first-parent --reverse "$tag..HEAD")
          $points = @($fps | Where-Object { (git log -1 --format=%B $_) -match '\[release\]' })
          if (-not $notesOnly -and $fps.Count -gt 0 -and ($points.Count -eq 0 -or $points[-1] -ne $fps[-1])) {
            $points += $fps[-1]   # HEAD = the build being released by this run (skipped when notes-only)
          }
          $out = New-Object System.Collections.Generic.List[string]
          $prev = $tag
          foreach ($r in $points) {
            $n = [int](git rev-list --count "$tag..$r")
            # Always emit the header, even for an empty group (a build with no displayed change types)
            $out.Add("- $mn.$n")
            foreach ($c in @(git rev-list --reverse $r --not $prev)) {
              if ($lineOf.ContainsKey($c)) { $out.Add("  + $($lineOf[$c])") }
            }
            $prev = $r
          }
          $notes = ($out -join "`n").Trim()
          # Per-item commit link: the template emits '__REPO__' -> current repo URL
          $notes = $notes -replace '__REPO__', "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)"
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Release $tag" }
          Set-Content -Path RELEASE_NOTES.md -Value $notes -Encoding utf8

          # Create Release 'vM.N.0' if missing (on the already-existing tag), else update its notes.
          # Guard: gh/git are native commands -> a non-zero exit does NOT throw under 'Stop', so check
          # manually; otherwise the job would falsely "succeed" while publishing nothing (e.g. the tag
          # was never pushed -> vM.N.0 does not exist).
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "gh release edit '$tag' failed" }
          } else {
            gh release create $tag --title $tag --notes-file RELEASE_NOTES.md --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "gh release create '$tag' failed (is tag '$tag' pushed to origin?)" }
          }

          if ($notesOnly) {
            Write-Host "notes-only mode -> skip nupkg upload & nuget push"
          } else {
            # Attach every nupkg from this build (clobber if rebuilding the same version).
            gh release upload $tag ($nupkgs.FullName) --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload '$tag' failed" }

            # Push to nuget.org only when the nugetKey secret exists. Push core first (others depend on it).
            if (-not [string]::IsNullOrWhiteSpace($env:NUGET_KEY)) {
              $ordered = @($nupkgs | Sort-Object { $_.Name.Length })
              foreach ($pkg in $ordered) {
                dotnet nuget push $pkg.FullName -k $env:NUGET_KEY -s https://api.nuget.org/v3/index.json --skip-duplicate
                if ($LASTEXITCODE -ne 0) { throw "nuget push failed for $($pkg.Name)" }
              }
            } else {
              Write-Host "No 'nugetKey' secret -> skip nuget.org push"
            }
          }
