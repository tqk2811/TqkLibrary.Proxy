# git-cliff config dedicated to GitHub Release notes (used by CI .github/workflows/release.yml).
# Differs from a local CHANGELOG.md config: NO header/footer. Used with range '<tag>..HEAD'
# (every commit since tag vM.N.0, including commits merged in from other branches).
#
# The template ONLY emits '__SHA_<sha>__ <formatted content>' per commit (no numbering,
# no final ordering). release.yml uses the sha to build the notes structure by [release] BUILDs:
# - Build point R = first-parent commit carrying the '[release]' marker (+ current run's HEAD);
#   header '- M.N.<zzz>' with zzz = rev-list --count tag..R (= nupkg version, GitVersion counts ALL commits)
# - Sub-item '  + <content>' = every new commit in (R_prev..R], including commits merged from other branches

[changelog]
header = ""
# Only list change types users care about (filtered at the display step).
# To add/remove types: edit the list in `commit.group in [...]` below.
# Each item links to its commit: on the scope, or on (type) when the commit has no scope.
# '__REPO__' is replaced by release.yml with $GITHUB_SERVER_URL/$GITHUB_REPOSITORY.
body = """
{% for commit in commits %}\
{% if commit.group in ["feat", "fix", "perf", "revert", "refactor", "chore"] %}\
__SHA_{{ commit.id }}__ {% if commit.scope %}({{ commit.group }}) [**{{ commit.scope }}**](__REPO__/commit/{{ commit.id }}){% else %}[({{ commit.group }})](__REPO__/commit/{{ commit.id }}){% endif %} {{ commit.message | upper_first }}{% if commit.breaking %} [**breaking**]{% endif %}
{% endif %}\
{% endfor %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    { pattern = '  +', replace = " " },
]
commit_parsers = [
    { message = "^feat", group = "feat" },
    { message = "^fix", group = "fix" },
    { message = "^perf", group = "perf" },
    { message = "^refactor", group = "refactor" },
    { message = "^docs", group = "docs" },
    { message = "^test", group = "test" },
    { message = "^build", group = "build" },
    { message = "^ci", group = "ci" },
    { message = "^style", group = "style" },
    { message = "^revert", group = "revert" },
    { message = "^sample", group = "sample" },
    { message = "^chore", group = "chore" },
    { message = ".*", group = "other" },
    # Numbering/ordering are decided by release.yml (lookup by sha), so skipping would not break it;
    # display-type filtering still happens in the body template, kept in one place.
]
filter_commits = false
tag_pattern = '[vV]?[0-9]+\.[0-9]+\.[0-9]+'
# Output order does not matter (release.yml looks up by sha); oldest for determinism.
sort_commits = "oldest"
