name: Release

# CI build + publish. KHONG chay mac dinh: chi build khi commit (head cua push) chua marker
# '[release]'. Cung cho chay tay (workflow_dispatch).
# Mode notes-only: marker '[release_notes_only]' (hoac dispatch voi input release_notes_only)
# chi sinh lai GitHub Release notes (khong build/pack/upload/nuget); khong tinh HEAD la diem build.
#
# Mo hinh /releases: moi dong minor M.N co 1 GitHub Release ten theo tag 'vM.N.0'.
# Moi lan chay -> pack MOI thu vien co .nuspec version 'M.N.<so-commit>' -> upload tat ca nupkg lam
# asset vao Release 'vM.N.0' + cap nhat notes (tang dan, danh so) cac change ke tu 'vM.N.0'.
#
# Tien dieu kien: tag 'vM.N.0' phai ton tai tren origin truoc (moc GitVersion + ten Release).
# Push nuget.org chi khi co secret 'nugetKey'.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_notes_only:
        description: 'Only regenerate GitHub Release notes (skip build/pack/upload/nuget)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[release_notes_only]')
    runs-on: windows-latest
    env:
      # 'true' khi chi sinh notes: dispatch chon release_notes_only, hoac head commit chua '[release_notes_only]'
      NOTES_ONLY: ${{ inputs.release_notes_only || contains(github.event.head_commit.message, '[release_notes_only]') }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TFM cao nhat la net8.0, SDK moi build duoc TFM cu qua reference packs. Nen major >= 8 la du;
      # chi setup-dotnet khi chua co (windows-latest thuong da co >= 8).
      - name: Check installed .NET SDKs
        if: env.NOTES_ONLY != 'true'
        id: dotnet_check
        shell: pwsh
        run: |
          $sdks = if (Get-Command dotnet -ErrorAction SilentlyContinue) { @(dotnet --list-sdks 2>$null) } else { @() }
          $haveSdk = [bool]($sdks | Where-Object { if ($_ -match '^(\d+)\.') { [int]$Matches[1] -ge 8 } })
          $install = -not $haveSdk
          Add-Content -Path $env:GITHUB_OUTPUT -Value "install=$($install.ToString().ToLower())"
          Write-Host "Installed SDKs:`n$($sdks -join "`n")"
          Write-Host "Have .NET SDK >= 8: $haveSdk  -> install=$install"

      - name: Setup .NET
        if: ${{ env.NOTES_ONLY != 'true' && steps.dotnet_check.outputs.install == 'true' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install git-cliff
        shell: pwsh
        run: |
          $ver = "2.13.1"
          $url = "https://github.com/orhun/git-cliff/releases/download/v$ver/git-cliff-$ver-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP "git-cliff.zip"
          Invoke-WebRequest $url -OutFile $zip
          $dst = Join-Path $env:RUNNER_TEMP "git-cliff"
          Expand-Archive $zip -DestinationPath $dst -Force
          $exe = Get-ChildItem $dst -Recurse -Filter git-cliff.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

      - name: "Build + pack (9 thu vien TqkLibrary.Proxy.*)"
        if: env.NOTES_ONLY != 'true'
        shell: pwsh
        run: ./.github/workflows/BuildCI.ps1   # pack only; nuget push handled below

      - name: Create/update Release, upload nupkg, push nuget
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_KEY: ${{ secrets.nugetKey }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notesOnly = $env:NOTES_ONLY -eq 'true'
          if ($notesOnly) {
            # Notes-only: khong co nupkg -> suy M.N tu ten branch (neu la version-branch M.N);
            # branch khac (master) thi lay tag gan nhat trong lich su.
            $bn = $env:GITHUB_REF_NAME
            if ($bn -match '^(\d+)\.(\d+)$') { $major = $Matches[1]; $minor = $Matches[2] }
            else {
              $near = "$(git describe --tags --abbrev=0 --match "v[0-9]*")".Trim()
              if ($near -notmatch '^v(\d+)\.(\d+)\.') { throw "Cannot derive minor line from branch '$bn' / tag '$near'" }
              $major = $Matches[1]; $minor = $Matches[2]
            }
            $nupkgs = @()
          } else {
            $nupkgs = @(Get-ChildItem ./artifacts/*.nupkg)
            if ($nupkgs.Count -eq 0) { throw "No .nupkg produced by BuildCI.ps1" }
            # Version M.N lay tu package loi 'TqkLibrary.Proxy' (ten = TqkLibrary.Proxy.<M>.<N>.<build>.nupkg).
            $core = $nupkgs | Where-Object { $_.Name -match '^TqkLibrary\.Proxy\.(\d+)\.(\d+)\.(\d+)\.nupkg$' } | Select-Object -First 1
            if (-not $core) { throw "Cannot find core TqkLibrary.Proxy nupkg to parse version" }
            $null = $core.Name -match '^TqkLibrary\.Proxy\.(\d+)\.(\d+)\.(\d+)\.nupkg$'
            $major = $Matches[1]; $minor = $Matches[2]
          }
          $tag = "v$major.$minor.0"   # tag co prefix 'v' (v1.0.0)
          $mn  = "$major.$minor"
          if ($notesOnly) { Write-Host "notes-only  release-tag=$tag" }
          else { Write-Host "$($nupkgs.Count) nupkg  release-tag=$tag" }

          # Release notes: moi BUILD la 1 header '- M.N.<zzz>' voi zzz = rev-list --count tag..R
          # (khop version nupkg vi GitVersion dem MOI commit). Diem build R = cac commit
          # first-parent co marker '[release]' + HEAD hien tai (build cua run nay, khong trung
          # neu HEAD chinh la [release]). Muc con '  + ...' = moi commit moi reachable trong
          # (R_truoc..R] — tu nhien gom ca commit merge tu branch khac.
          # git-cliff chi format tung commit, moi dong prefix '__SHA_<sha>__' de tra cuu.
          $lineOf = @{}
          foreach ($l in @(git-cliff --config cliff-release.toml "$tag..HEAD")) {
            if ($l -match '^__SHA_([0-9a-f]+)__ (.*)$') { $lineOf[$Matches[1]] = $Matches[2] }
          }
          $fps = @(git rev-list --first-parent --reverse "$tag..HEAD")
          $points = @($fps | Where-Object { (git log -1 --format=%B $_) -match '\[release\]' })
          if (-not $notesOnly -and $fps.Count -gt 0 -and ($points.Count -eq 0 -or $points[-1] -ne $fps[-1])) {
            $points += $fps[-1]   # HEAD = build dang phat hanh boi run nay (bo qua khi notes-only)
          }
          $out = New-Object System.Collections.Generic.List[string]
          $prev = $tag
          foreach ($r in $points) {
            $n = [int](git rev-list --count "$tag..$r")
            # Header luon hien, ke ca nhom rong (build khong co thay doi thuoc loai hien thi)
            $out.Add("- $mn.$n")
            foreach ($c in @(git rev-list --reverse $r --not $prev)) {
              if ($lineOf.ContainsKey($c)) { $out.Add("  + $($lineOf[$c])") }
            }
            $prev = $r
          }
          $notes = ($out -join "`n").Trim()
          # Link commit trong tung muc: template emit '__REPO__' -> URL repo hien tai
          $notes = $notes -replace '__REPO__', "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)"
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Release $tag" }
          Set-Content -Path RELEASE_NOTES.md -Value $notes -Encoding utf8

          # Tao Release 'vM.N.0' neu chua co (tren tag da ton tai), neu co thi cap nhat notes.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --notes-file RELEASE_NOTES.md
          } else {
            gh release create $tag --title $tag --notes-file RELEASE_NOTES.md --verify-tag
          }

          if ($notesOnly) {
            Write-Host "notes-only mode -> skip nupkg upload & nuget push"
          } else {
            # Dinh kem tat ca nupkg cua lan build nay (clobber neu rebuild cung version).
            gh release upload $tag ($nupkgs.FullName) --clobber

            # Push nuget.org chi khi co secret nugetKey. Push core truoc (cac package khac phu thuoc no).
            if (-not [string]::IsNullOrWhiteSpace($env:NUGET_KEY)) {
              $ordered = @($nupkgs | Sort-Object { $_.Name.Length })
              foreach ($pkg in $ordered) {
                dotnet nuget push $pkg.FullName -k $env:NUGET_KEY -s https://api.nuget.org/v3/index.json --skip-duplicate
              }
            } else {
              Write-Host "No 'nugetKey' secret -> skip nuget.org push"
            }
          }
